[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wq-framework"
version = "0.1.0"
description = "Open-source, extensible framework for river water quality prediction (placeholder name)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
